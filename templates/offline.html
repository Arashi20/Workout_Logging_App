<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a90e2">
    <title>Offline - AMStrength</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='AMS_favicon.png') }}">
    <!-- Styles are inlined so this page renders even when the stylesheet
         isn't in the cache. It must never depend on the network. -->
    <style>
        :root {
            --bg-color: #eceff1;
            --card-bg: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #546e7a;
            --border-color: #cfd8dc;
            --primary-color: #2c3e50;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: #333333;
            --primary-color: #4a90e2;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .offline-card {
            width: 100%;
            max-width: 26rem;
            padding: 2.5rem 2rem;
            text-align: center;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .offline-brand {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }

        .offline-icon { font-size: 3rem; line-height: 1; }

        h1 {
            font-size: 1.5rem;
            margin: 1rem 0 0.75rem;
            color: var(--text-primary);
        }

        p {
            margin: 0 0 1.75rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        button {
            width: 100%;
            padding: 0.85rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            color: #ffffff;
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover { opacity: 0.9; }

        .offline-note {
            margin: 1.5rem 0 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-brand">AMStrength</div>
        <div class="offline-icon">📡</div>
        <h1>You're offline</h1>
        <p>AMStrength needs a connection to load your workouts. Check your signal and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
        <p class="offline-note">Nothing you've already logged is affected.</p>
    </div>

    <script>
        // Match the theme chosen elsewhere in the app.
        document.documentElement.setAttribute(
            'data-theme', localStorage.getItem('theme') || 'light'
        );
        // Reload automatically as soon as the connection comes back.
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
